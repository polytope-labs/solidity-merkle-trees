name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.81.0
          override: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Forge build
        run: |
          pnpm install --ignore-scripts
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      - name: Download SVM Releases List
        run: |
            wget -O /tmp/svm_releases_list.json https://raw.githubusercontent.com/nikitastupin/solc/2287d4326237172acf91ce42fd7ec18a67b7f512/linux/aarch64/list.json
            echo "SVM_RELEASES_LIST_JSON=/tmp/svm_releases_list.json" >> $GITHUB_ENV

      - name: cargo test
        run: |
          forge build
          cd ./tests/rust
          cargo test --release -- --nocapture

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # Pin nightly: substrate's transitive wasmtime/rustix uses
      # '#[cfg_attr(rustc_attrs, ...)]', which recent nightlies reject as
      # reserved. This pin matches the rust-toolchain (1.81.0) era.
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-09-01
          override: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-fuzz
        # Pin: latest cargo-fuzz (0.13+) pulls clap_builder requiring the
        # 'edition2024' cargo feature, which isn't stabilised in our pinned
        # nightly. 0.12.0 is the last version before that requirement.
        run: cargo install cargo-fuzz --version 0.12.0 --locked

      - name: Download SVM Releases List
        run: |
          wget -O /tmp/svm_releases_list.json https://raw.githubusercontent.com/nikitastupin/solc/2287d4326237172acf91ce42fd7ec18a67b7f512/linux/aarch64/list.json
          echo "SVM_RELEASES_LIST_JSON=/tmp/svm_releases_list.json" >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Build contracts
        run: |
          pnpm install --ignore-scripts
          forge build

      - name: Fuzz trie proof valid
        run: cd tests/rust && cargo fuzz run trie_proof_valid -- -max_total_time=120

      - name: Fuzz trie proof invalid
        run: cd tests/rust && cargo fuzz run trie_proof_invalid -- -max_total_time=120

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --manifest-path ./tests/rust/Cargo.toml --all -- --check
